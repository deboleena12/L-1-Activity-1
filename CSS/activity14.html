<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App Homepage</title>
    <link rel="stylesheet" href="activity14.css">
    <style>
        h1 {
            font-size: 36px;
            color: white;
        }

        .subtitle {
            font-size: 18px;
            color: #f0f8ff
        }

        #temperature {
            font-size: 48px;
            font-weight: bold;
            color: #fffacd;
        }

        .details {
            font-size: 18px;
            color: white;
        }

        .forecast-title {
            color: darkslategrey
        }

        .day {
            border: 2px solid black;
            font-size: 17px;
            color: black;
        }
    </style>
</head>

<body>
    <h1>My Weather App Homepage</h1>

    <p class="subtitle">
        Check today's weather and plan your day better.
    </p>

    <div class="weather-card">
        <div class="weather-card">Cloud</div>

        <p id="temperature">28°C</p>

        <p class="details">City: Bengaluru</p>
        <p class="details">Condition: Partly Cloudy</p>
        <p class="details">Humidity: 62%</p>
        <p class="details">Wind Speed: 12 km/h</p>
    </div>

    <h2>Weekly Forecast</h2>
    <div class="forecast-section">
        <h3 class="forecast-title">Next 5 days</h3>

        <p class="day">Sun: Sunny - 30°C</p>
        <p class="day">Mon: Cloudy - 27°C</p>
        <p class="day">Tue: Sunny - 24°C</p>
        <p class="day">Wed: Windy - 26°C</p>
        <p class="day">Thu: Sunny - 23°C</p>   
    </div>


</body>

</html>
