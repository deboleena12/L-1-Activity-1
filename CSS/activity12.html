<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS</title>

    <style>

        /* Universal Selector - applies to everything on the page */

        * {
            font-size: 16px;
        }

        /* Element Selectors */
        body {
            background-color:beige;
        }

        h1 {
             color:blue;
        }
        h2 {
            color:cadetblue;
        }

        p {
            color:brown;
        }

        /* Class Selector */
        .my-detail {
            color:black;
            font-weight:bold;
        }

        /* ID selector */
        #my-card {
            background-color:gold
        }
    </style>
</head>

<body>

    <h1>My Colour Card</h1>

    <!--Inline CSS: Add style="color: _____;" inside this p tag-->

    <p style="color:crimson"> Hi! This is my very own webpage.</p>

    <div id="my-card">

        <h2>About Me</h2>
        <p class="my-detail">My name is Deboleena.</p>
        <p class="my-detail">My favourite color is red.</p>
        <p class="my-detail">My favourite subject is Biology.</p>
        <p class="my-detail">My favourite food is pasta.</p>

    </div>

    <h2>My Favourite Things</h2>
    <p>My favourite animal is a cat.</p>
    <p>My favourite sport is a badminton.</p>
    <p>My favourite movie is a Tangled.</p>
    
</body>

</html>
