<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
  <button onclick="multi(5)">Execute JS function</button>

<script>
    function multi(y, z) {
        if (z === undefined) {
            z = 6;
        }
        document.write(y * z);
    }
</script>
</body>
</html>
