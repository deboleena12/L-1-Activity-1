<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators</title>
</head>

<body>




    
        <h2>Addition</h2>
        <p id="demo"></p>
        <script>
           
            //*use +, -, *, / operators*/
            var x = 5;
            var y = 2;
            var z = x + y;
            document.getElementById("demo").innerHTML = z;

        </script>

   
        <h2> Subtraction</h2>
        <p id="sub"></p>
        <script>
            
            //*use +, -, *, / operators*/
            var x = 5;
            var y = 2;
            var z = x - y;
            document.getElementById("sub").innerHTML = z;

        </script>
    
    
    
        <h2> Multiplication</h2>
        <p id="multi"></p>
        <script>
            
            //*use +, -, *, / operators*/
            var x = 5;
            var y = 2;
            var z = x * y;
            document.getElementById("multi").innerHTML = z;

        </script>
    
  

    <h2> Division </h2>
    <p id="div"></p>
    <script>
      
        //*use +, -, *, / operators*/
        var x = 6;
        var y = 2;
        var z = x / y;
        document.getElementById("div").innerHTML = z;

    </script>



</body>

</html>
