<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="form-card">
        <h1>Event Registration Form</h1>
        <p>Fill in the form to register for the school event and generate your event pass.</p>
        <form id="eventForm">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" required minlength="3" placeholder="Enter your name">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="Enter your email">
            <label for="age">Age</label>
            <input type="number" id="age" required min="8" max="18" placeholder="Enter your age">
            <label for="eventName">Choose Event</label>
            <select id="eventName" required></select>
            <option value="">Select an event</option>
            <option value="Science Fair">Science Fair</option>
            <option value="Coding Workshop">Coding Workshop</option>
            <option value="Sports Day">Sports Day</option>

    </div>
</body>

</html>
